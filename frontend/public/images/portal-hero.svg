<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="160" fill="url(#coreGlow)"/>

  <!-- -DB'* 'D(H'() -->
  <circle cx="200" cy="200" r="118" stroke="#22d3ee" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="200" r="88" stroke="#a78bfa" stroke-width="1" stroke-dasharray="6 8" opacity="0.25"/>
  <circle cx="200" cy="200" r="62" stroke="#22d3ee" stroke-width="1.5" opacity="0.35"/>

  <!-- F,E) E*E1C2) *E'E'K AJ (200, 200) -->
  <g filter="url(#starGlow)">
    <polygon
      points="200,148 212.93,182.2 249.45,183.93 220.94,206.79 230.56,242.11 200,222 169.44,242.11 179.06,206.79 150.55,183.93 187.07,182.2"
      fill="#22d3ee"
      opacity="0.92"
    />
    <polygon
      points="200,158 210.5,185.5 238,186.8 216,204 223,230 200,215 177,230 184,204 162,186.8 189.5,185.5"
      fill="#a5f3fc"
      opacity="0.45"
    />
  </g>

  <!-- FB'7 6H! -->
  <circle cx="200" cy="200" r="4" fill="#e0f2fe" opacity="0.9"/>
</svg>
